# SPDX-License-Identifier: MIT

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/aprilsoftware/pi-run

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          }
          echo "PI_RUN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-release dist
          (cd dist && sha256sum -c "pi-run-${PI_RUN_VERSION}.tar.gz.sha256")

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=${PI_RUN_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${PI_RUN_VERSION}" \
            docker

      - name: Push runtime image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker push "${IMAGE_NAME}:${PI_RUN_VERSION}"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Image push failed after ${attempt} attempts." >&2
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Image push attempt ${attempt} failed; retrying in ${delay}s." >&2
            sleep "${delay}"
          done

      - name: Attach archive and checksum to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "LICENSE" \
            "install.sh" \
            "dist/pi-run-${PI_RUN_VERSION}.tar.gz" \
            "dist/pi-run-${PI_RUN_VERSION}.tar.gz.sha256" \
            --clobber
